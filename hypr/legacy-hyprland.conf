# hyprlang fallback, for Hyprland < 0.55 ONLY (0.56+ uses hyprland.lua and ignores this file).
# ~/.config/hypr/hyprland.conf
# Legacy Gruvbox fallback. Quickshell draws the bar / panels; Fuzzel is the app launcher.

monitor = , preferred, auto, auto

$mod = SUPER
$terminal = kitty
$files = nautilus
$browser = zen-browser
$editor = obsidian
$music = spotify
$hermes = hermes-desktop

# ------------------------------------------------------------------ startup
exec-once = quickshell

# ------------------------------------------------------------------ env
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

# ------------------------------------------------------------------ look (gruvbox)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(d79921ff) rgba(fabd2fff) 45deg
    col.inactive_border = rgba(504945aa)
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 5
        passes = 2
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(1d2021aa)
    }
}

animations {
    enabled = true
    bezier = gruvOut, 0.05, 0.9, 0.1, 1.05
    bezier = gruvIn, 0.3, -0.05, 1, 0

    animation = windows, 1, 5, gruvOut, popin 85%
    animation = windowsOut, 1, 4, gruvIn, popin 85%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, gruvOut, slide
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    focus_on_activate = true
}

xwayland {
    force_zero_scaling = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

# ------------------------------------------------------------------ 4 workspaces
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true

# ------------------------------------------------------------------ keybinds
# the ones you asked for
bind = $mod, SPACE, exec, fuzzel
bind = $mod SHIFT, RETURN, exec, $browser
bind = $mod SHIFT, F, exec, $files
bind = $mod, RETURN, exec, $terminal
bind = $mod SHIFT, O, exec, $editor
bind = $mod SHIFT, S, exec, $music
bind = $mod SHIFT, Z, exec, zeditor
bind = $mod, W, killactive,
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod SHIFT, C, exec, kitty -e opencode
bind = $mod SHIFT, H, exec, $hermes

# extras (say the word and I'll drop them): move between / move windows
# between the 4 workspaces, focus, and the media + volume keys
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
